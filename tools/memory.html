<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یادآور | بازی صبا رسانه</title>

<meta name="description"
content="بازی سرگرم‌کننده حافظه و خاطرات صبا رسانه">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7f6;
    color:#263238;
    font-family:Tahoma,Arial,sans-serif;
    line-height:1.8;
}

button{
    font-family:inherit;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:10px 10px 35px;
}


/* بازگشت */

.back-button{
    display:block;
    width:100%;
    margin-bottom:10px;
    padding:12px;
    background:#fff;
    color:#176b5b;
    border:1px solid #dce7e3;
    border-radius:15px;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:900;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}


/* سربرگ */

.header{
    background:linear-gradient(145deg,#176b5b,#0f5145);
    color:#fff;
    text-align:center;
    padding:22px 15px;
    border-radius:23px;
    box-shadow:0 8px 30px rgba(20,60,50,.12);
}

.logo{
    font-size:46px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:3px 0 0;
    font-size:14px;
}


/* کارت */

.card{
    background:#fff;
    margin-top:12px;
    padding:16px 13px;
    border-radius:21px;
    box-shadow:0 6px 25px rgba(20,60,50,.06);
}


/* شروع */

.intro{
    text-align:center;
}

.intro h2{
    margin:0 0 5px;
    color:#176b5b;
    font-size:21px;
}

.intro p{
    margin:0;
    color:#69756f;
    font-size:14px;
}

.start-button{
    width:100%;
    min-height:60px;
    margin-top:18px;
    border:0;
    border-radius:16px;
    background:#176b5b;
    color:#fff;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
}


/* آمار */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    background:#f1f6f4;
    border-radius:13px;
    padding:7px 3px;
    text-align:center;
}

.stat-label{
    color:#75817d;
    font-size:11px;
}

.stat-value{
    color:#176b5b;
    font-size:19px;
    font-weight:900;
}


/* پیشرفت */

.progress-info{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#6e7975;
}

.progress{
    height:9px;
    background:#e7edeb;
    border-radius:20px;
    overflow:hidden;
    margin:5px 0 16px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#176b5b;
    transition:.35s;
}


/* سؤال */

.question{
    text-align:center;
}

.question-type{
    color:#8a9691;
    font-size:13px;
}

.question h2{
    margin:4px 0 12px;
    font-size:20px;
    line-height:1.55;
}


/* =========================
   تایمر
========================= */

.timer{
    text-align:center;
    margin:0 auto 14px;
}

.timer-title{
    color:#176b5b;
    font-size:14px;
    font-weight:900;
    margin-bottom:6px;
}

.timer-circle{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    background:#176b5b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    box-shadow:
        0 5px 16px rgba(23,107,91,.28);
    border:5px solid #d9eee8;
}


/* تصاویر */

.memory-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:10px;
}

.memory-item{
    min-height:90px;
    background:#f7f9f8;
    border:2px solid #e3e9e6;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 2px;
}

.memory-icon{
    font-size:42px;
    line-height:1.15;
}

.memory-name{
    font-size:12px;
    color:#596660;
    line-height:1.4;
    margin-top:3px;
}


/* پاسخ‌ها */

.answers{
    display:grid;
    gap:10px;
}

.answer-button{
    width:100%;
    min-height:58px;
    background:#fff;
    border:2px solid #dfe7e3;
    border-radius:15px;
    font-size:17px;
    font-weight:800;
    color:#263238;
    cursor:pointer;
}

.answer-button:active{
    transform:scale(.97);
}

.answer-button.correct{
    background:#e8f5ef;
    border-color:#26956f;
    color:#126247;
}

.answer-button.wrong{
    background:#fff0ee;
    border-color:#dc6d62;
    color:#a53c32;
}


/* پیام */

.feedback{
    min-height:31px;
    margin-top:12px;
    text-align:center;
    font-size:15px;
    font-weight:900;
}

.feedback.good{
    color:#167255;
}

.feedback.bad{
    color:#b3453b;
}


/* نتیجه */

.result{
    text-align:center;
}

.result-icon{
    font-size:62px;
}

.result h2{
    color:#176b5b;
    margin:0;
    font-size:25px;
}

.score-circle{
    width:180px;
    height:180px;
    margin:18px auto;
    border-radius:50%;
    background:#e8f5f1;
    border:10px solid #cce7df;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.score-number{
    color:#176b5b;
    font-size:48px;
    font-weight:900;
    line-height:1.2;
}

.score-label{
    font-size:13px;
    color:#65736e;
}

.new-record{
    color:#b17b00;
    font-weight:900;
    margin-top:-8px;
    min-height:25px;
}

.result-message{
    background:#fff6dd;
    border:1px solid #efdfae;
    color:#6d571e;
    border-radius:16px;
    padding:14px;
    font-size:15px;
    font-weight:700;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-top:12px;
}

.result-stat{
    background:#f5f7f6;
    border-radius:14px;
    padding:10px;
}

.result-stat strong{
    display:block;
    color:#176b5b;
    font-size:20px;
}


/* کنترل‌ها */

.controls{
    display:grid;
    gap:9px;
    margin-top:15px;
}

.control-button{
    width:100%;
    min-height:55px;
    border:0;
    border-radius:15px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.primary{
    background:#176b5b;
    color:#fff;
}

.secondary{
    background:#edf2f0;
    color:#35433e;
}

.share{
    background:#fff1cf;
    color:#765b17;
}


/* سابقه */

.history{
    margin-top:15px;
    text-align:right;
}

.history-title{
    color:#176b5b;
    font-size:18px;
    font-weight:900;
    margin-bottom:7px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #edf0ef;
    padding:8px 0;
    font-size:13px;
}

.history-score{
    color:#176b5b;
    font-weight:900;
}

.empty-history{
    color:#7b8581;
    font-size:13px;
}


/* مخفی */

.hidden{
    display:none!important;
}


/* انیمیشن */

.pop{
    animation:pop .25s ease;
}

@keyframes pop{

    0%{
        transform:scale(.96);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}


/* موبایل */

@media(max-width:380px){

    .container{
        padding-left:8px;
        padding-right:8px;
    }

    .header{
        padding:20px 12px;
    }

    .header h1{
        font-size:24px;
    }

    .card{
        padding:14px 9px;
    }

    .memory-grid{
        gap:6px;
    }

    .memory-item{
        min-height:82px;
        border-radius:12px;
    }

    .memory-icon{
        font-size:36px;
    }

    .memory-name{
        font-size:11px;
    }

    .timer-circle{
        width:76px;
        height:76px;
        font-size:28px;
    }

    .question h2{
        font-size:18px;
    }

    .answer-button{
        font-size:16px;
    }

}

</style>

</head>


<body>

<div class="container">


<a
href="../index.html"
class="back-button">

← بازگشت به جعبه‌ابزار صبا

</a>


<header class="header">

<div class="logo">🧠</div>

<h1>یادآور</h1>

<p>
بازی حافظه و خاطرات برای ذهن‌های بازنشسته
</p>

</header>


<!-- صفحه شروع -->

<section
id="startScreen"
class="card intro">

<h2>
حافظه‌ات هنوز سرحاله؟
</h2>

<p>
چند تصویر را به خاطر بسپار و ببین چند مرحله می‌توانی دوام بیاوری.
</p>

<button
class="start-button"
onclick="startGame()">

🎮 شروع بازی

</button>

</section>


<!-- صفحه بازی -->

<section
id="gameScreen"
class="card hidden">


<div class="stats">

<div class="stat">

<div class="stat-label">
امتیاز
</div>

<div
id="score"
class="stat-value">
۰
</div>

</div>


<div class="stat">

<div class="stat-label">
مرحله
</div>

<div
id="level"
class="stat-value">
۱
</div>

</div>


<div class="stat">

<div class="stat-label">
رکورد
</div>

<div
id="bestScore"
class="stat-value">
۰
</div>

</div>

</div>


<div class="progress-info">

<span id="progressText">
مرحله ۱
</span>

<span>
حافظه تصویری
</span>

</div>


<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>


<div
id="question"
class="question">
</div>


<div
id="feedback"
class="feedback">
</div>

</section>


<!-- صفحه نتیجه -->

<section
id="resultScreen"
class="card result hidden">

<div
id="resultIcon"
class="result-icon">
🏆
</div>

<h2>
این دور تمام شد!
</h2>


<div class="score-circle">

<div
id="finalScore"
class="score-number">
۰
</div>

<div class="score-label">
امتیاز این دور
</div>

</div>


<div
id="recordMessage"
class="new-record">
</div>


<div
id="resultMessage"
class="result-message">
</div>


<div class="result-stats">

<div class="result-stat">

رکورد شما

<strong
id="finalBest">
۰
</strong>

</div>


<div class="result-stat">

تعداد بازی‌ها

<strong
id="gamesPlayed">
۰
</strong>

</div>

</div>


<div class="controls">

<button
class="control-button primary"
onclick="playAgain()">

🔄 بازی دوباره

</button>


<button
class="control-button share"
onclick="shareResult()">

📤 اشتراک نتیجه

</button>


<button
class="control-button secondary"
onclick="toggleHistory()">

📊 مشاهده سابقه

</button>

</div>


<div
id="history"
class="history hidden">

<div class="history-title">
بازی‌های اخیر
</div>

<div id="historyList"></div>

</div>


</section>


</div>


<script>

/* =========================
   اطلاعات بازی
========================= */

const items = [

{icon:"📻",name:"رادیو"},
{icon:"📼",name:"نوار کاست"},
{icon:"☎️",name:"تلفن قدیمی"},
{icon:"📺",name:"تلویزیون"},
{icon:"🕰️",name:"ساعت"},
{icon:"📷",name:"دوربین"},
{icon:"🚲",name:"دوچرخه"},
{icon:"💡",name:"چراغ"},
{icon:"📚",name:"کتاب"},
{icon:"✏️",name:"مداد"},
{icon:"🎒",name:"کیف"},
{icon:"☕",name:"فنجان"}

];


let level = 1;

let score = 0;

let bestScore = Number(
localStorage.getItem("yadavare_best") || 0
);

let gamesPlayed = Number(
localStorage.getItem("yadavare_games") || 0
);

let historyData = JSON.parse(
localStorage.getItem("yadavare_history") || "[]"
);

let currentAnswer = null;


/*
   تصاویری که در همین مرحله
   واقعاً به کاربر نمایش داده شده‌اند.
*/

let currentMemoryItems = [];

let acceptingAnswer = false;

let timer = null;


/* =========================
   شروع بازی
========================= */

function startGame(){

level = 1;

score = 0;

clearInterval(timer);

document
.getElementById("startScreen")
.classList
.add("hidden");

document
.getElementById("resultScreen")
.classList
.add("hidden");

document
.getElementById("gameScreen")
.classList
.remove("hidden");

updateStats();

startLevel();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   بازی دوباره
========================= */

function playAgain(){

document
.getElementById("resultScreen")
.classList
.add("hidden");

document
.getElementById("gameScreen")
.classList
.remove("hidden");

level = 1;

score = 0;

clearInterval(timer);

updateStats();

startLevel();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   شروع مرحله
========================= */

function startLevel(){

acceptingAnswer = false;

clearInterval(timer);


/*
   تعداد تصاویر:
   مرحله ۱ و ۲ = ۵ تصویر
   مرحله ۳ و ۴ = ۶ تصویر
   مرحله ۵ و ۶ = ۷ تصویر
   مرحله ۷ و ۸ = ۸ تصویر
   مرحله ۹ به بعد = ۹ تصویر
*/

const levelSize =
Math.min(
5 + Math.floor((level-1)/2),
9
);


/*
   زمان مشاهده تصاویر:

   مرحله ۱ و ۲ = ۷ ثانیه
   مرحله ۳ تا ۵ = ۶ ثانیه
   مرحله ۶ به بعد = ۵ ثانیه

   این زمان عمداً کمی سخاوتمندانه
   انتخاب شده تا بازی برای کاربر
   قابل فهم و لذت‌بخش باشد.
*/

const memorySeconds =
level <= 2 ? 7 :
level <= 5 ? 6 :
5;


/*
   تمام آیتم‌ها را به‌هم می‌ریزیم.
*/

const shuffledItems =
shuffle([...items]);


/*
   گروه اول:
   تصاویری که واقعاً نمایش داده می‌شوند.
*/

const memoryItems =
shuffledItems.slice(
0,
levelSize
);


/*
   گروه دوم:
   تصاویری که اصلاً نمایش داده نمی‌شوند.
*/

const notShown =
shuffledItems.slice(
levelSize
);


/*
   پاسخ درست حتماً از گروه
   دیده‌نشده انتخاب می‌شود.
*/

currentAnswer =
notShown[
Math.floor(
Math.random()*notShown.length
)
];


/*
   ذخیره تصاویر همین مرحله
   برای ساخت گزینه‌های غلط.
*/

currentMemoryItems =
memoryItems;


/*
   نمایش مرحله.
*/

renderMemory(
memoryItems,
memorySeconds
);

}


/* =========================
   نمایش تصاویر و تایمر
========================= */

function renderMemory(
selected,
seconds
){

const question =
document.getElementById(
"question"
);


document.getElementById(
"progressText"
).textContent =
"مرحله " +
persian(level);


document.getElementById(
"progressBar"
).style.width =
Math.min(
level*10,
100
)+"%";


let html = `

<div class="question-type">

حافظه تصویری

</div>

<h2>

این تصاویر را خوب به خاطر بسپار

</h2>


<div class="timer">

<div class="timer-title">

⏱️ زمان باقی‌مانده

</div>

<div
id="timerCircle"
class="timer-circle">

${persian(seconds)}

</div>

</div>


<div class="memory-grid">

`;


selected.forEach(item=>{

html += `

<div class="memory-item">

<div class="memory-icon">

${item.icon}

</div>

<div class="memory-name">

${item.name}

</div>

</div>

`;

});


html += `

</div>

`;


question.innerHTML = html;


question.classList
.remove("pop");

void question.offsetWidth;

question.classList
.add("pop");


let remaining = seconds;


/*
   تایمر از همان لحظه نمایش
   تصاویر شروع می‌شود.
*/

timer = setInterval(()=>{

remaining--;


const timerCircle =
document.getElementById(
"timerCircle"
);


if(timerCircle){

timerCircle.textContent =
persian(
Math.max(
remaining,
0
)
);

}


/*
   وقتی زمان تمام شد،
   سؤال نمایش داده می‌شود.
*/

if(remaining <= 0){

clearInterval(timer);

showQuestion();

}

},1000);

}


/* =========================
   نمایش سؤال
========================= */

function showQuestion(){

acceptingAnswer = true;


const question =
document.getElementById(
"question"
);


/*
   سه گزینه غلط حتماً از
   تصاویر دیده‌شده همین مرحله
   انتخاب می‌شوند.
*/

const wrongOptions =
shuffle(
[
...currentMemoryItems
]
).slice(
0,
3
);


/*
   پاسخ درست تنها تصویری است
   که اصلاً نمایش داده نشده.
*/

const options =
shuffle([
currentAnswer,
...wrongOptions
]);


question.innerHTML = `

<div class="question-type">

حافظه تصویری

</div>

<h2>

کدام تصویر در تصاویر قبلی نبود؟

</h2>

<div class="answers">

${options.map(
item=>`

<button
class="answer-button"
data-name="${item.name}">

${item.icon}

&nbsp;

${item.name}

</button>

`
).join("")}

</div>

`;


question.classList
.remove("pop");

void question.offsetWidth;

question.classList
.add("pop");


/*
   اتصال رویداد کلیک.
*/

question
.querySelectorAll(
".answer-button"
)
.forEach(btn=>{

btn.addEventListener(
"click",
()=>answer(
btn,
btn.dataset.name
)
);

});

}


/* =========================
   پاسخ
========================= */

function answer(
button,
name
){

if(!acceptingAnswer){

return;

}

acceptingAnswer = false;


const buttons =
document.querySelectorAll(
".answer-button"
);


buttons.forEach(
btn =>
btn.disabled = true
);


if(
name ===
currentAnswer.name
){

button.classList
.add("correct");


const earned =
level * 10;


score += earned;


showFeedback(
"آفرین! درست یادت ماند 👏",
true
);


setTimeout(()=>{

level++;

updateStats();

startLevel();

},1000);


}else{

button.classList
.add("wrong");


buttons.forEach(
btn=>{

if(
btn.dataset.name ===
currentAnswer.name
){

btn.classList
.add("correct");

}

}
);


showFeedback(
"این تصویر در تصاویر قبلی نبود. دوباره امتحان کن 🙂",
false
);


setTimeout(
endGame,
1200
);

}

}


/* =========================
   پیام
========================= */

function showFeedback(
text,
good
){

const feedback =
document.getElementById(
"feedback"
);


feedback.textContent =
text;


feedback.className =
"feedback " +
(
good
?
"good"
:
"bad"
);

}


/* =========================
   پایان بازی
========================= */

function endGame(){

clearInterval(timer);

gamesPlayed++;

localStorage.setItem(
"yadavare_games",
gamesPlayed
);


let newRecord = false;


if(score > bestScore){

bestScore = score;

newRecord = true;

localStorage.setItem(
"yadavare_best",
bestScore
);

}


/*
   ذخیره سابقه
*/

historyData.unshift({

score:score,

level:level,

date:new Date()
.toLocaleDateString(
"fa-IR"
)

});


historyData =
historyData.slice(
0,
10
);


localStorage.setItem(
"yadavare_history",
JSON.stringify(
historyData
)
);


/*
   نمایش نتیجه
*/

document
.getElementById(
"gameScreen"
)
.classList
.add("hidden");


document
.getElementById(
"resultScreen"
)
.classList
.remove("hidden");


document.getElementById(
"finalScore"
).textContent =
persian(score);


document.getElementById(
"finalBest"
).textContent =

).textContent =

/* =========================
   پیام نتیجه
========================= */

function getResultIcon(
score
){

if(score >= 300)
return "🧠";

if(score >= 150)
return "🏆";

if(score >= 70)
return "👏";

return "🙂";

}


function getResultMessage(
score
){

if(score >= 300){

return "حافظه‌ات واقعاً سرحاله! معلوم است مغزت هنوز تصمیم نگرفته بازنشسته شود.";

}

if(score >= 150){

return "خیلی خوب بود! چند مرحله دیگر بازی کن و ببین رکوردت کجا می‌ایستد.";

}

if(score >= 70){

return "خوب شروع کردی. یک دور دیگر برو، شاید رکوردت را جابه‌جا کنی.";

}

return "این فقط گرم‌کردن بود. یک دور دیگر بازی کن.";

}


/* =========================

========================= */

function toggleHistory(){

const history =
document.getElementById(
"history"
);

history.classList
.toggle("hidden");

renderHistory();

}


function renderHistory(){

const list =
document.getElementById(
"historyList"
);


if(
historyData.length === 0
){

list.innerHTML = `

<div class="empty-history">

هنوز بازی‌ای ثبت نشده است.

</div>

`;

return;

}


list.innerHTML =
historyData.map(
(item,index)=>`

<div class="history-item">

<span>

بازی ${persian(index+1)}

<br>

${item.date}

</span>

<span class="history-score">

${persian(item.score)}
امتیاز

</span>

</div>

`
).join("");

}

/* =========================
   ابزارهای کمکی
========================= */

function shuffle(
array
){

for(
let i=array.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()*(i+1)
);

[
array[i],
array[j]
] =
[
array[j],
array[i]
];

}

return array;

}

/* =========================
   تبدیل اعداد به فارسی
========================= */

function persian(
number
){

return String(number)
.replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}
