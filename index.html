<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>جعبه‌ابزار صبا رسانه</title>

<meta name="description"
content="ابزارهای کاربردی صبا رسانه برای بازنشستگان و خانواده‌ها">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7f6;
    color:#263238;
    font-family:Tahoma,Arial,sans-serif;
    line-height:1.8;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px 12px 35px;
}


/* سربرگ */

.header{
    background:linear-gradient(
        145deg,
        #176b5b,
        #0f5145
    );

    color:white;
    text-align:center;
    padding:28px 18px;

    border-radius:25px;

    box-shadow:
        0 8px 30px
        rgba(20,60,50,.12);
}

.logo{
    font-size:48px;
}

.header h1{
    margin:4px 0;
    font-size:27px;
}

.header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.95;
}


/* معرفی */

.intro{
    text-align:center;
    margin:20px 5px;
}

.intro h2{
    margin:0;
    font-size:21px;
    color:#176b5b;
}

.intro p{
    margin:5px 0;
    color:#6b7280;
    font-size:14px;
}


/* ابزارها */

.tools{
    display:grid;
    gap:13px;
}

/* دسته‌بندی ابزارها */

/* دسته‌بندی ابزارها */

.categories{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:5px 2px 13px;

    margin-bottom:5px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;

    scroll-behavior:smooth;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-button{
    flex:0 0 auto;

    min-height:43px;

    border:1px solid #dce7e3;

    background:#fff;

    color:#53615c;

    padding:8px 17px;

    border-radius:15px;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:
        background .18s,
        color .18s,
        transform .12s;

    white-space:nowrap;
}

.category-button:active{
    transform:scale(.96);
}

.category-button.active{
    background:#176b5b;

    color:#fff;

    border-color:#176b5b;

    box-shadow:
        0 4px 10px
        rgba(23,107,91,.16);
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-button{
    flex:0 0 auto;
    border:1px solid #dce7e3;
    background:#fff;
    color:#53615c;
    padding:9px 15px;
    border-radius:14px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.category-button.active{
    background:#176b5b;
    color:#fff;
    border-color:#176b5b;
}    

/* کارت ابزار */

.tool{
    display:flex;
    align-items:center;
    gap:14px;

    background:white;
    color:#263238;

    text-decoration:none;

    padding:17px;

    border-radius:19px;

    border:1px solid #e4ebe8;

    box-shadow:
        0 5px 20px
        rgba(20,60,50,.06);

    transition:.15s;
}

.tool:active{
    transform:scale(.98);
}


/* آیکون */

.tool-icon{
    width:60px;
    height:60px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:#e8f5f1;

    font-size:31px;
}


/* متن */

.tool-content{
    flex:1;
}

.tool-title{
    font-size:18px;
    font-weight:900;
    color:#176b5b;
}

.tool-description{
    color:#6b7280;
    font-size:13px;
    line-height:1.7;
    margin-top:2px;
}


/* فلش */

.arrow{
    color:#9aa7a3;
    font-size:24px;
    font-weight:bold;
}


/* کانال */

.channel{
    display:block;

    margin-top:18px;

    background:#fff4d8;
    color:#725711;

    border:1px solid #efdfae;

    border-radius:18px;

    padding:15px;

    text-align:center;

    text-decoration:none;

    font-size:15px;
    font-weight:900;
}


/* پاورقی */

.footer{
    text-align:center;

    margin-top:22px;

    color:#89938f;

    font-size:11px;

    line-height:1.7;
}


/* موبایل */

@media(max-width:380px){

    .header{
        padding:23px 14px;
    }

    .header h1{
        font-size:24px;
    }

    .tool{
        padding:14px;
    }

    .tool-icon{
        width:54px;
        height:54px;
        font-size:27px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- سربرگ -->

<header class="header">

<div class="logo">
🧰
</div>

<h1>
جعبه‌ابزار صبا رسانه
</h1>

<p>
ابزارهای ساده و کاربردی برای زندگی بهتر
</p>

</header>


<!-- معرفی -->

<section class="intro">

<h2>
ابزارهای کاربردی
</h2>

<p>
برای استفاده، ابزار موردنظر خود را انتخاب کنید.
</p>

</section>

<div class="categories" id="categories"></div>

<section
    class="tools"
    id="toolsList">
</section>



<!-- کانال -->

<a
class="channel"
href="https://t.me/saba_rasanehh"
target="_blank">

📢

مطالب و اخبار صبا رسانه

</a>


<!-- پایین -->

<footer class="footer">

صبا رسانه

<br>

صدای حقیقت، مطالبه عدالت

</footer>


</div>


<!-- فایل مرکزی ابزارها -->

<script src="data/tools.js"></script>
<script>

document.addEventListener("DOMContentLoaded", function () {

    const toolsList =
        document.getElementById("toolsList");

    const categories =
        document.getElementById("categories");

    if (
        !toolsList ||
        !categories ||
        typeof tools === "undefined"
    ) {
        return;
    }


    /* ساخت دسته‌ها */

    const categoryNames = [
        "همه",
        ...new Set(
            tools.map(tool => tool.category)
        )
    ];


    categoryNames.forEach(function(category, index){

        const button =
            document.createElement("button");

        button.className =
            "category-button" +
            (index === 0 ? " active" : "");

        button.textContent =
            category;

        button.onclick = function(){

            document
                .querySelectorAll(".category-button")
                .forEach(function(btn){

                    btn.classList.remove("active");

                });

            button.classList.add("active");

            showTools(category);

        };

        categories.appendChild(button);

    });


    /* نمایش ابزارها */

    function showTools(category){

        toolsList.innerHTML = "";

        const filteredTools =
            category === "همه"
            ? tools
            : tools.filter(
                tool =>
                tool.category === category
            );


        filteredTools.forEach(function(tool){

            const card =
                document.createElement("a");

            card.className = "tool";

            card.href = tool.url;

            card.innerHTML = `

                <div class="tool-icon">
                    ${tool.icon}
                </div>

                <div class="tool-content">

                    <div class="tool-title">
                        ${tool.title}
                    </div>

                    <div class="tool-description">
                        ${tool.description}
                    </div>

                </div>

                <div class="arrow">
                    ‹
                </div>

            `;

            toolsList.appendChild(card);

        });

    }


    /* نمایش اولیه */

    showTools("همه");

});

</script>


</body>
</html>
