<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>یادآور | بازی صبا رسانه</title>

<meta name="description"
content="بازی سرگرم‌کننده حافظه و خاطرات صبا رسانه">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f7f6;
    color:#263238;
    font-family:Tahoma,Arial,sans-serif;
    line-height:1.8;
}

button{
    font-family:inherit;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:10px 10px 35px;
}


/* بازگشت */

.back-button{
    display:block;
    width:100%;
    margin-bottom:10px;
    padding:12px;
    background:#fff;
    color:#176b5b;
    border:1px solid #dce7e3;
    border-radius:15px;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:900;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}


/* سربرگ */

.header{
    background:linear-gradient(145deg,#176b5b,#0f5145);
    color:#fff;
    text-align:center;
    padding:22px 15px;
    border-radius:23px;
    box-shadow:0 8px 30px rgba(20,60,50,.12);
}

.logo{
    font-size:46px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:3px 0 0;
    font-size:14px;
}


/* کارت */

.card{
    background:#fff;
    margin-top:12px;
    padding:16px 13px;
    border-radius:21px;
    box-shadow:0 6px 25px rgba(20,60,50,.06);
}


/* شروع */

.intro{
    text-align:center;
}

.intro h2{
    margin:0 0 5px;
    color:#176b5b;
    font-size:21px;
}

.intro p{
    margin:0;
    color:#69756f;
    font-size:14px;
}

.start-button{
    width:100%;
    min-height:60px;
    margin-top:18px;
    border:0;
    border-radius:16px;
    background:#176b5b;
    color:#fff;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
}


/* آمار */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    background:#f1f6f4;
    border-radius:13px;
    padding:7px 3px;
    text-align:center;
}

.stat-label{
    color:#75817d;
    font-size:11px;
}

.stat-value{
    color:#176b5b;
    font-size:19px;
    font-weight:900;
}


/* پیشرفت */

.progress-info{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#6e7975;
}

.progress{
    height:9px;
    background:#e7edeb;
    border-radius:20px;
    overflow:hidden;
    margin:5px 0 16px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#176b5b;
    transition:.35s;
}


/* سؤال */

.question{
    text-align:center;
}

.question-type{
    color:#8a9691;
    font-size:13px;
}

.question h2{
    margin:4px 0 15px;
    font-size:21px;
    line-height:1.6;
}


/* نوار شمارش معکوس */

.memory-timer{
    margin:0 auto 15px;
    padding:10px 14px;
    background:#fff4d8;
    border:2px solid #efd991;
    border-radius:18px;
    text-align:center;
}

.memory-timer-label{
    display:block;
    color:#80651c;
    font-size:13px;
    font-weight:900;
    margin-bottom:2px;
}

.timer-circle{
    width:72px;
    height:72px;
    margin:5px auto 0;
    border-radius:50%;
    background:#176b5b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    box-shadow:0 4px 15px rgba(23,107,91,.25);
}


/* هشدار آخر زمان */

.timer-circle.warning{
    background:#d88900;
    transform:scale(1.08);
}

.timer-circle.danger{
    background:#c94b3e;
    transform:scale(1.1);
}


/* تصاویر */

.memory-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:13px;
}

.memory-item{
    min-height:105px;
    background:#f7f9f8;
    border:2px solid #e3e9e6;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px;
}

.memory-icon{
    font-size:42px;
    line-height:1.2;
}

.memory-name{
    font-size:12px;
    color:#596660;
    margin-top:2px;
}


/* پاسخ‌ها */

.answers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.answer-button{
    width:100%;
    min-height:65px;
    background:#fff;
    border:2px solid #dfe7e3;
    border-radius:15px;
    font-size:17px;
    font-weight:800;
    color:#263238;
    cursor:pointer;
    padding:8px;
}

.answer-button:active{
    transform:scale(.97);
}

.answer-button:disabled{
    cursor:default;
}

.answer-button.correct{
    background:#e8f5ef;
    border-color:#26956f;
    color:#126247;
}

.answer-button.wrong{
    background:#fff0ee;
    border-color:#dc6d62;
    color:#a53c32;
}


/* پیام */

.feedback{
    min-height:31px;
    margin-top:12px;
    text-align:center;
    font-size:15px;
    font-weight:900;
}

.feedback.good{
    color:#167255;
}

.feedback.bad{
    color:#b3453b;
}


/* نتیجه */

.result{
    text-align:center;
}

.result-icon{
    font-size:62px;
}

.result h2{
    color:#176b5b;
    margin:0;
    font-size:25px;
}

.score-circle{
    width:180px;
    height:180px;
    margin:18px auto;
    border-radius:50%;
    background:#e8f5f1;
    border:10px solid #cce7df;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.score-number{
    color:#176b5b;
    font-size:48px;
    font-weight:900;
    line-height:1.2;
}

.score-label{
    font-size:13px;
    color:#65736e;
}

.new-record{
    color:#b17b00;
    font-weight:900;
    margin-top:-8px;
    min-height:25px;
}

.result-message{
    background:#fff6dd;
    border:1px solid #efdfae;
    color:#6d571e;
    border-radius:16px;
    padding:14px;
    font-size:15px;
    font-weight:700;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-top:12px;
}

.result-stat{
    background:#f5f7f6;
    border-radius:14px;
    padding:10px;
}

.result-stat strong{
    display:block;
    color:#176b5b;
    font-size:20px;
}


/* کنترل‌ها */

.controls{
    display:grid;
    gap:9px;
    margin-top:15px;
}

.control-button{
    width:100%;
    min-height:55px;
    border:0;
    border-radius:15px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.primary{
    background:#176b5b;
    color:#fff;
}

.secondary{
    background:#edf2f0;
    color:#35433e;
}

.share{
    background:#fff1cf;
    color:#765b17;
}


/* سابقه */

.history{
    margin-top:15px;
    text-align:right;
}

.history-title{
    color:#176b5b;
    font-size:18px;
    font-weight:900;
    margin-bottom:7px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #edf0ef;
    padding:8px 0;
    font-size:13px;
}

.history-score{
    color:#176b5b;
    font-weight:900;
}

.empty-history{
    color:#7b8581;
    font-size:13px;
}


/* مخفی */

.hidden{
    display:none!important;
}


/* انیمیشن */

.pop{
    animation:pop .25s ease;
}

@keyframes pop{

    0%{
        transform:scale(.96);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}


/* موبایل */

@media(max-width:500px){

    .memory-grid{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .memory-item{
        min-height:96px;
    }

    .memory-icon{
        font-size:37px;
    }

    .memory-name{
        font-size:11px;
    }

    .timer-circle{
        width:68px;
        height:68px;
        font-size:28px;
    }

}


@media(max-width:380px){

    .header h1{
        font-size:24px;
    }

    .memory-grid{
        gap:5px;
    }

    .memory-item{
        min-height:84px;
    }

    .memory-icon{
        font-size:32px;
    }

    .memory-name{
        font-size:10px;
    }

    .question h2{
        font-size:19px;
    }

    .answer-button{
        font-size:15px;
        min-height:60px;
    }

}

</style>

</head>


<body>

<div class="container">


<a
href="../index.html"
class="back-button">

← بازگشت به جعبه‌ابزار صبا

</a>


<header class="header">

<div class="logo">🧠</div>

<h1>یادآور</h1>

<p>
بازی حافظه و خاطرات برای ذهن‌های بازنشسته
</p>

</header>


<!-- صفحه شروع -->

<section
id="startScreen"
class="card intro">

<h2>
حافظه‌ات هنوز سرحاله؟
</h2>

<p>
چند تصویر را به خاطر بسپار و ببین چند مرحله می‌توانی دوام بیاوری.
</p>

<button
class="start-button"
onclick="startGame()">

🎮 شروع بازی

</button>

</section>


<!-- صفحه بازی -->

<section
id="gameScreen"
class="card hidden">


<div class="stats">

<div class="stat">

<div class="stat-label">
امتیاز
</div>

<div
id="score"
class="stat-value">
۰
</div>

</div>


<div class="stat">

<div class="stat-label">
مرحله
</div>

<div
id="level"
class="stat-value">
۱
</div>

</div>


<div class="stat">

<div class="stat-label">
رکورد
</div>

<div
id="bestScore"
class="stat-value">
۰
</div>

</div>

</div>


<div class="progress-info">

<span id="progressText">
مرحله ۱
</span>

<span>
حافظه تصویری
</span>

</div>


<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>


<div
id="question"
class="question">
</div>


<div
id="feedback"
class="feedback">
</div>

</section>


<!-- صفحه نتیجه -->

<section
id="resultScreen"
class="card result hidden">

<div
id="resultIcon"
class="result-icon">
🏆
</div>

<h2>
این دور تمام شد!
</h2>


<div class="score-circle">

<div
id="finalScore"
class="score-number">
۰
</div>

<div class="score-label">
امتیاز این دور
</div>

</div>


<div
id="recordMessage"
class="new-record">
</div>


<div
id="resultMessage"
class="result-message">
</div>


<div class="result-stats">

<div class="result-stat">

رکورد شما

<strong
id="finalBest">
۰
</strong>

</div>


<div class="result-stat">

تعداد بازی‌ها

<strong
id="gamesPlayed">
۰
</strong>

</div>

</div>


<div class="controls">

<button
class="control-button primary"
onclick="playAgain()">

🔄 بازی دوباره

</button>


<button
class="control-button share"
onclick="shareResult()">

📤 اشتراک نتیجه

</button>


<button
class="control-button secondary"
onclick="toggleHistory()">

📊 مشاهده سابقه

</button>

</div>


<div
id="history"
class="history hidden">

<div class="history-title">
بازی‌های اخیر
</div>

<div id="historyList"></div>

</div>


</section>


</div>


<script>

/* =========================
   اطلاعات بازی
========================= */

const items = [

{
    id:"radio",
    icon:"📻",
    name:"رادیو"
},

{
    id:"cassette",
    icon:"📼",
    name:"نوار کاست"
},

{
    id:"oldphone",
    icon:"☎️",
    name:"تلفن قدیمی"
},

{
    id:"tv",
    icon:"📺",
    name:"تلویزیون"
},

{
    id:"clock",
    icon:"🕰️",
    name:"ساعت"
},

{
    id:"camera",
    icon:"📷",
    name:"دوربین"
},

{
    id:"bicycle",
    icon:"🚲",
    name:"دوچرخه"
},

{
    id:"lamp",
    icon:"💡",
    name:"چراغ"
},

{
    id:"book",
    icon:"📚",
    name:"کتاب"
},

{
    id:"pencil",
    icon:"✏️",
    name:"مداد"
},

{
    id:"bag",
    icon:"🎒",
    name:"کیف"
},

{
    id:"cup",
    icon:"☕",
    name:"فنجان"
}

];


let level = 1;

let score = 0;

let bestScore =
Number(
localStorage.getItem("yadavare_best") || 0
);

let gamesPlayed =
Number(
localStorage.getItem("yadavare_games") || 0
);

let historyData =
JSON.parse(
localStorage.getItem(
"yadavare_history"
) || "[]"
);

let currentAnswer = null;

let acceptingAnswer = false;

let timer = null;


/* =========================
   شروع بازی
========================= */

function startGame(){

level = 1;

score = 0;

clearInterval(timer);

document
.getElementById("startScreen")
.classList
.add("hidden");

document
.getElementById("resultScreen")
.classList
.add("hidden");

document
.getElementById("gameScreen")
.classList
.remove("hidden");

updateStats();

startLevel();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   بازی دوباره
========================= */

function playAgain(){

document
.getElementById("resultScreen")
.classList
.add("hidden");

document
.getElementById("gameScreen")
.classList
.remove("hidden");

level = 1;

score = 0;

clearInterval(timer);

updateStats();

startLevel();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   شروع مرحله
========================= */

function startLevel(){

acceptingAnswer = false;

clearInterval(timer);


/*
   تعداد تصاویر:
   حداقل 5 و حداکثر 9
*/

const levelSize =
Math.min(
5 + Math.floor((level - 1) / 2),
9
);


/*
   زمان نمایش تصاویر
*/

const memorySeconds =
level <= 2 ? 7 :
level <= 4 ? 6 :
level <= 6 ? 5 :
4;


/*
   انتخاب تصاویر
*/

const selected =
shuffle([...items])
.slice(0,levelSize);


/*
   انتخاب تصویر حذف‌شونده

   اینجا به جای نام،
   خود شیء ذخیره می‌شود.
*/

const missingIndex =
Math.floor(
Math.random() * selected.length
);

currentAnswer =
selected[missingIndex];


renderMemory(
selected,
memorySeconds
);

}


/* =========================
   نمایش تصاویر
========================= */

function renderMemory(
selected,
seconds
){

const question =
document.getElementById("question");


document.getElementById(
"progressText"
).textContent =
"مرحله " + persian(level);


document.getElementById(
"progressBar"
).style.width =
Math.min(level * 10,100) + "%";


let html = `

<div class="question-type">

این تصاویر را خوب به خاطر بسپار

</div>

<h2>

تصویر حذف‌شده را پیدا کن

</h2>

<div class="memory-timer">

<span class="memory-timer-label">

⏳ زمان باقی‌مانده

</span>

<div
id="timerCircle"
class="timer-circle">

${persian(seconds)}

</div>

</div>

<div class="memory-grid">

`;


selected.forEach(item=>{

html += `

<div class="memory-item">

<div class="memory-icon">

${item.icon}

</div>

<div class="memory-name">

${item.name}

</div>

</div>

`;

});


html += `

</div>

`;


question.innerHTML = html;


question.classList.remove("pop");

void question.offsetWidth;

question.classList.add("pop");


let remaining = seconds;


/*
   نمایش اولیه تایمر
*/

updateTimerDisplay(
remaining
);


/*
   شمارش دقیق ثانیه‌ها
*/

timer = setInterval(()=>{

remaining--;

updateTimerDisplay(
remaining
);


if(remaining <= 0){

clearInterval(timer);

showQuestion();

}

},1000);

}


/* =========================
   نمایش تایمر
========================= */

function updateTimerDisplay(
remaining
){

const timerCircle =
document.getElementById(
"timerCircle"
);

if(!timerCircle){

return;

}


timerCircle.textContent =
persian(
Math.max(remaining,0)
);


timerCircle.classList.remove(
"warning",
"danger"
);


if(remaining <= 2){

timerCircle.classList.add(
"danger"
);

}

else if(remaining <= 4){

timerCircle.classList.add(
"warning"
);

}

}


/* =========================
   نمایش سؤال
========================= */

function showQuestion(){

acceptingAnswer = true;

clearInterval(timer);


const question =
document.getElementById(
"question"
);


/*
   سه گزینه اشتباه
*/

const wrongOptions =
shuffle(
items.filter(
item =>
item.id !== currentAnswer.id
)
)
.slice(0,3);


/*
   گزینه‌ها
*/

const options =
shuffle([
currentAnswer,
...wrongOptions
]);


question.innerHTML = `

<div class="question-type">

حافظه تصویری

</div>

<h2>

کدام تصویر حذف شده بود؟

</h2>

<div class="answers">

${options.map(item=>`

<button
type="button"
class="answer-button"
data-id="${item.id}">

${item.icon}

&nbsp;

${item.name}

</button>

`).join("")}

</div>

`;


/*
   اتصال رویداد به دکمه‌ها

   این بخش عمداً بدون onclick
   نوشته شده است تا مشکل مقایسه
   متن فارسی کاملاً حذف شود.
*/

document
.querySelectorAll(".answer-button")
.forEach(button=>{

button.addEventListener(
"click",
function(){

answer(
this,
this.dataset.id
);

});

});

}


/* =========================
   پاسخ کاربر
========================= */

function answer(
button,
selectedId
){

if(!acceptingAnswer){

return;

}


acceptingAnswer = false;


const buttons =
document.querySelectorAll(
".answer-button"
);


buttons.forEach(
btn=>{
    btn.disabled = true;
}
);


/*
   تشخیص صحیح فقط بر اساس ID
*/

const isCorrect =
selectedId ===
currentAnswer.id;


if(isCorrect){

button.classList.add(
"correct"
);


/*
   امتیاز مرحله
*/

const earned =
level * 10;

score += earned;


showFeedback(
"آفرین! درست یادت مانده بود 👏",
true
);


setTimeout(()=>{

level++;

updateStats();

startLevel();

},1000);


}

else{

button.classList.add(
"wrong"
);


/*
   پیدا کردن پاسخ صحیح
*/

buttons.forEach(
btn=>{

if(
btn.dataset.id ===
currentAnswer.id
){

btn.classList.add(
"correct"
);

}

}
);


showFeedback(
"این یکی یادت رفت. دوباره امتحانش می‌کنیم 🙂",
false
);


setTimeout(
endGame,
1200
);

}

}


/* =========================
   پیام
========================= */

function showFeedback(
text,
good
){

const feedback =
document.getElementById(
"feedback"
);

feedback.textContent =
text;

feedback.className =
"feedback " +
(
good
?
"good"
:
"bad"
);

}


/* =========================
   پایان بازی
========================= */

function endGame(){

clearInterval(timer);

acceptingAnswer = false;

gamesPlayed++;

localStorage.setItem(
"yadavare_games",
gamesPlayed
);


const oldBest =
bestScore;


let newRecord = false;


if(score > bestScore){

bestScore = score;

newRecord = true;

localStorage.setItem(
"yadavare_best",
bestScore
);

}


/*
   ذخیره سابقه
*/

historyData.unshift({

score:score,

level:level,

date:new Date()
.toLocaleDateString("fa-IR")

});


historyData =
historyData.slice(0,10);


localStorage.setItem(
"yadavare_history",
JSON.stringify(
historyData
)
);


/*
   نمایش نتیجه
*/

document
.getElementById("gameScreen")
.classList
.add("hidden");

document
.getElementById("resultScreen")
.classList
.remove("hidden");


document.getElementById(
"finalScore"

/* =========================
   پیام نتیجه
========================= */

function getResultIcon(score){

if(score >= 300)
return "🧠";

if(score >= 150)
return "🏆";

if(score >= 70)
return "👏";

return "🙂";

}


function getResultMessage(score){

if(score >= 300){

return "حافظه‌ات واقعاً سرحاله! معلوم است مغزت هنوز تصمیم نگرفته بازنشسته شود.";

}

if(score >= 150){

return "خیلی خوب بود! چند مرحله دیگر بازی کن و ببین رکوردت کجا می‌ایستد.";

}

if(score >= 70){

return "خوب شروع کردی. یک دور دیگر برو، شاید رکوردت را جابه‌جا کنی.";

}

return "این فقط گرم‌کردن بود. یک دور دیگر بازی کن.";

}


/* =========================

========================= */

function toggleHistory(){

const history =
document.getElementById(
"history"
);

history.classList.toggle(
"hidden"
);

renderHistory();

}


function renderHistory(){

const list =
document.getElementById(
"historyList"
);


if(historyData.length === 0){

list.innerHTML = `

<div class="empty-history">

هنوز بازی‌ای ثبت نشده است.

</div>

`;

return;

}


list.innerHTML =
historyData.map(
(item,index)=>`

<div class="history-item">

<span>

بازی ${persian(index+1)}

<br>

${item.date}

</span>

<span class="history-score">

${persian(item.score)}

امتیاز

</span>

</div>

`
).join("");

}

/* =========================
   ابزارهای کمکی
========================= */

function shuffle(array){

for(
let i=array.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()*(i+1)
);

[
array[i],
array[j]
] =
[
array[j],
array[i]
];

}

return array;

}

function persian(number){

return String(number)
.replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}
