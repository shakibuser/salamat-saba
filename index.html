<script>

function getIranDate(){

    const now = new Date();

    const iranDate =
        new Date(
            now.toLocaleString(
                "en-US",
                {
                    timeZone:"Asia/Tehran"
                }
            )
        );


    const weekDays = [
        "یکشنبه",
        "دوشنبه",
        "سه‌شنبه",
        "چهارشنبه",
        "پنجشنبه",
        "جمعه",
        "شنبه"
    ];


    const persianMonths = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند"
    ];


    const gy =
        iranDate.getFullYear();

    const gm =
        iranDate.getMonth() + 1;

    const gd =
        iranDate.getDate();


    function gregorianToJalali(gy,gm,gd){

        const g_d_m = [
            0,31,59,90,120,151,
            181,212,243,273,304,334
        ];

        let jy;

        if(gy > 1600){
            jy = 979;
            gy -= 1600;
        }else{
            jy = 0;
            gy -= 621;
        }

        const gy2 =
            (gm > 2)
            ? gy + 1
            : gy;

        let days =
            (365 * gy)
            + Math.floor((gy2 + 3) / 4)
            - Math.floor((gy2 + 99) / 100)
            + Math.floor((gy2 + 399) / 400)
            - 80
            + gd
            + g_d_m[gm - 1];

        jy += 33 *
            Math.floor(days / 12053);

        days %= 12053;

        jy += 4 *
            Math.floor(days / 1461);

        days %= 1461;

        if(days > 365){

            jy += Math.floor(
                (days - 1) / 365
            );

            days =
                (days - 1) % 365;

        }

        let jm;

        if(days < 186){

            jm =
                1 +
                Math.floor(days / 31);

            const jd =
                1 +
                (days % 31);

            return [jy,jm,jd];

        }else{

            jm =
                7 +
                Math.floor(
                    (days - 186) / 30
                );

            const jd =
                1 +
                ((days - 186) % 30);

            return [jy,jm,jd];

        }

    }


    const jalali =
        gregorianToJalali(
            gy,
            gm,
            gd
        );


    const jy = jalali[0];

    const jm = jalali[1];

    const jd = jalali[2];


    const persianNumbers = function(value){

    return String(value).replace(
        /\d/g,
        function(d){
            return "۰۱۲۳۴۵۶۷۸۹"[d];
        }
    );

};


document
    .getElementById("todayDate")
    .textContent =
    "امروز، " +
    weekDays[iranDate.getDay()] +
    " " +
    persianNumbers(jd) +
    " " +
    persianMonths[jm - 1] +
    " " +
    persianNumbers(jy);

}


getIranDate();

</script>    
<script>

document.addEventListener("DOMContentLoaded", function () {

    const toolsList =
        document.getElementById("toolsList");

    const categories =
        document.getElementById("categories");

    if (
        !toolsList ||
        !categories ||
        typeof tools === "undefined"
    ) {
        return;
    }


    /* ساخت دسته‌ها */

    const categoryNames = [
        "همه",
        ...new Set(
            tools.map(tool => tool.category)
        )
    ];


    categoryNames.forEach(function(category, index){

        const button =
            document.createElement("button");

        button.className =
            "category-button" +
            (index === 0 ? " active" : "");

        button.textContent =
            category;

        button.onclick = function(){

            document
                .querySelectorAll(".category-button")
                .forEach(function(btn){

                    btn.classList.remove("active");

                });

            button.classList.add("active");

            showTools(category);

        };

        categories.appendChild(button);

    });


    /* نمایش ابزارها */

    function showTools(category){

        toolsList.innerHTML = "";

        const filteredTools =
            category === "همه"
            ? tools
            : tools.filter(
                tool =>
                tool.category === category
            );


        filteredTools.forEach(function(tool){

            const card =
                document.createElement("a");

            card.className = "tool";

            card.href = tool.url;

            card.innerHTML = `

                <div class="tool-icon">
                    ${tool.icon}
                </div>

                <div class="tool-content">

                    <div class="tool-title">
                        ${tool.title}
                    </div>

                    <div class="tool-description">
                        ${tool.description}
                    </div>

                </div>

                <div class="arrow">
                    ‹
                </div>

            `;

            toolsList.appendChild(card);

        });

    }


    /* نمایش اولیه */

    showTools("همه");

});

</script>
